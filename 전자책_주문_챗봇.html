<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>닻을올려라 — 구매 안내</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&family=Noto+Sans+KR:wght@300;400;500&display=swap');

  :root {
    --bg: #f5f0e8;
    --chat-bg: #faf7f2;
    --border: #ddd8ce;
    --accent: #2c4a2e;
    --accent-light: #4a7c4e;
    --gold: #c8a96e;
    --text: #1a1a1a;
    --muted: #7a7570;
    --bubble-bot: #ffffff;
    --bubble-user: #2c4a2e;
    --shadow: 0 2px 12px rgba(0,0,0,0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .phone-frame {
    width: 100%;
    max-width: 400px;
    height: 720px;
    background: var(--chat-bg);
    border: 1px solid var(--border);
    border-radius: 32px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.12), 0 4px 16px rgba(0,0,0,0.06);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  /* Header */
  .chat-header {
    background: var(--accent);
    padding: 20px 20px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  .avatar {
    width: 40px; height: 40px;
    background: var(--gold);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Noto Serif KR', serif;
    font-size: 16px;
    color: var(--accent);
    font-weight: 700;
    flex-shrink: 0;
  }
  .header-info { flex: 1; }
  .header-name {
    font-size: 15px;
    font-weight: 500;
    color: #fff;
    font-family: 'Noto Serif KR', serif;
  }
  .header-sub {
    font-size: 11px;
    color: rgba(255,255,255,0.6);
    margin-top: 2px;
  }
  .status-dot {
    width: 8px; height: 8px;
    background: #6fcf7a;
    border-radius: 50%;
    display: inline-block;
    margin-right: 4px;
  }

  /* Messages */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
  }
  .messages::-webkit-scrollbar { width: 0; }

  .msg-row {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    animation: msgIn 0.3s ease;
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg-row.user { flex-direction: row-reverse; }

  .msg-avatar {
    width: 28px; height: 28px;
    background: var(--gold);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    color: var(--accent);
    font-weight: 700;
    flex-shrink: 0;
  }
  .msg-row.user .msg-avatar { display: none; }

  .bubble {
    max-width: 80%;
    padding: 12px 14px;
    border-radius: 18px;
    font-size: 14px;
    line-height: 1.6;
  }
  .bot .bubble {
    background: var(--bubble-bot);
    color: var(--text);
    border-bottom-left-radius: 4px;
    box-shadow: var(--shadow);
  }
  .user .bubble {
    background: var(--bubble-user);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .bubble strong {
    display: block;
    font-weight: 500;
    margin-bottom: 4px;
  }
  .bubble .book-title {
    font-family: 'Noto Serif KR', serif;
    font-size: 15px;
    color: var(--accent);
    font-weight: 700;
    margin-bottom: 6px;
  }
  .bubble .price-tag {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    font-size: 13px;
    padding: 3px 10px;
    border-radius: 20px;
    margin: 4px 0 8px;
  }
  .bubble .divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 10px 0;
  }
  .bubble .account {
    background: #f5f0e8;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 13px;
    color: var(--text);
    line-height: 1.8;
    margin-top: 6px;
  }
  .bubble .account span {
    color: var(--muted);
    font-size: 12px;
  }

  /* Quick replies */
  .quick-replies {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 0 16px 12px;
    animation: msgIn 0.3s ease;
  }
  .qr-btn {
    background: #fff;
    border: 1.5px solid var(--accent);
    color: var(--accent);
    padding: 8px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
  }
  .qr-btn:hover, .qr-btn:active {
    background: var(--accent);
    color: #fff;
  }

  /* Input area */
  .input-area {
    padding: 12px 16px 20px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: center;
    background: var(--chat-bg);
    flex-shrink: 0;
  }
  .chat-input {
    flex: 1;
    border: 1.5px solid var(--border);
    border-radius: 24px;
    padding: 10px 16px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 14px;
    color: var(--text);
    background: #fff;
    outline: none;
    transition: border-color 0.2s;
  }
  .chat-input:focus { border-color: var(--accent); }
  .chat-input::placeholder { color: #bbb; }
  .send-btn {
    width: 40px; height: 40px;
    background: var(--accent);
    border: none;
    border-radius: 50%;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s;
    flex-shrink: 0;
  }
  .send-btn:hover { background: var(--accent-light); }
  .send-btn svg { width: 18px; height: 18px; fill: #fff; }

  /* Typing indicator */
  .typing {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 16px;
    animation: msgIn 0.3s ease;
  }
  .typing-bubble {
    background: var(--bubble-bot);
    border-radius: 18px;
    border-bottom-left-radius: 4px;
    padding: 12px 16px;
    box-shadow: var(--shadow);
    display: flex;
    gap: 4px;
    align-items: center;
  }
  .typing-dot {
    width: 7px; height: 7px;
    background: var(--muted);
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-6px); }
  }

  /* Input states */
  .input-state { display: none; }
  .input-state.active { display: flex; }
</style>
</head>
<body>

<div class="phone-frame">
  <div class="chat-header">
    <div class="avatar">닻</div>
    <div class="header-info">
      <div class="header-name">닻을올려라 구매 안내</div>
      <div class="header-sub"><span class="status-dot"></span>자동 응답 중</div>
    </div>
  </div>

  <div class="messages" id="messages"></div>

  <!-- Quick reply area -->
  <div id="quickReplies"></div>

  <!-- Input area: default -->
  <div class="input-area input-state active" id="inputDefault">
    <input class="chat-input" id="chatInput" placeholder="메시지를 입력하세요..." onkeydown="handleKey(event)">
    <button class="send-btn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
    </button>
  </div>
</div>

<script>
// ── 설정값 (실제 사용 시 여기만 수정) ──────────────────
const CONFIG = {
  bookTitle: '닻을올려라',
  author: '빠트',
  price: '19,900원',
  bank: '카카오뱅크',
  account: '3333-00-0000000',
  holder: '홍길동',  // 실제 예금주로 변경
  xHandle: '@aptlab',
  deliveryTime: '24시간 이내'
};
// ────────────────────────────────────────────────────

let step = 'start';
let userData = {};

const msgs = document.getElementById('messages');
const qr = document.getElementById('quickReplies');

// 단계별 시나리오
const flows = {
  start: {
    bot: [
      () => `안녕하세요 👋\n<span class="book-title">『${CONFIG.bookTitle}』</span> 구매 안내 챗봇입니다.\n\n무엇을 도와드릴까요?`
    ],
    quickReplies: ['📖 책 소개 보기', '💳 구매하기', '❓ 자주 묻는 질문']
  },
  info: {
    bot: [
      () => `<span class="book-title">『${CONFIG.bookTitle}』</span>\n저자: ${CONFIG.author}\n\n아파트 투자 실전 가이드입니다.\n입문자도 바로 적용할 수 있는 협상·계약·매도 전략을 담았습니다.\n\n<span class="price-tag">${CONFIG.price}</span>\n\nPDF 파일로 즉시 받아보실 수 있습니다.`
    ],
    quickReplies: ['💳 구매하기', '🔙 처음으로']
  },
  buy_start: {
    bot: [
      () => `구매 신청을 시작합니다.\n\n먼저 <strong>성함</strong>을 입력해주세요.\n(입금자명과 동일하게 입력해주세요)`
    ],
    input: 'name'
  },
  buy_email: {
    bot: [
      (name) => `감사합니다, ${name}님 😊\n\n다음으로 <strong>이메일 주소</strong>를 입력해주세요.\nPDF 파일을 이 주소로 발송해드립니다.`
    ],
    input: 'email'
  },
  buy_confirm: {
    bot: [
      (email) => {
        return `이메일 확인했습니다.\n\n아래 계좌로 입금해주시면\n${CONFIG.deliveryTime} 파일을 발송드립니다.\n\n<div class="account">🏦 <strong>${CONFIG.bank}</strong>\n<span>계좌번호</span>　${CONFIG.account}\n<span>예금주</span>　　${CONFIG.holder}\n<span>금액</span>　　　${CONFIG.price}</div>`
      }
    ],
    quickReplies: ['✅ 입금 완료했어요', '🔙 처음으로']
  },
  done: {
    bot: [
      () => `입금 확인 후 <strong>${CONFIG.deliveryTime}</strong> 이메일로 발송해드립니다 📬\n\n문의사항은 X(${CONFIG.xHandle})으로 DM 주세요.`
    ],
    quickReplies: ['🔙 처음으로']
  },
  faq: {
    bot: [
      () => `자주 묻는 질문입니다.\n\n<strong>Q. 파일 형식은?</strong>\nPDF 파일로 제공됩니다.\n\n<strong>Q. 언제 받을 수 있나요?</strong>\n입금 확인 후 ${CONFIG.deliveryTime} 이내 발송합니다.\n\n<strong>Q. 환불 가능한가요?</strong>\n파일 특성상 발송 후 환불이 어렵습니다.\n\n<strong>Q. 기타 문의</strong>\nX(${CONFIG.xHandle})로 DM 주세요.`
    ],
    quickReplies: ['💳 구매하기', '🔙 처음으로']
  }
};

function addBotMsg(html) {
  const row = document.createElement('div');
  row.className = 'msg-row bot';
  row.innerHTML = `
    <div class="msg-avatar">닻</div>
    <div class="bubble">${html.replace(/\n/g, '<br>')}</div>
  `;
  msgs.appendChild(row);
  scrollBottom();
}

function addUserMsg(text) {
  const row = document.createElement('div');
  row.className = 'msg-row user';
  row.innerHTML = `<div class="bubble">${text}</div>`;
  msgs.appendChild(row);
  scrollBottom();
}

function showTyping() {
  const t = document.createElement('div');
  t.className = 'typing';
  t.id = 'typing';
  t.innerHTML = `<div class="msg-avatar">닻</div><div class="typing-bubble"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>`;
  msgs.appendChild(t);
  scrollBottom();
}

function removeTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

function showQuickReplies(options) {
  qr.innerHTML = '';
  if (!options || options.length === 0) return;
  const wrap = document.createElement('div');
  wrap.className = 'quick-replies';
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'qr-btn';
    btn.textContent = opt;
    btn.onclick = () => handleQR(opt);
    wrap.appendChild(btn);
  });
  qr.appendChild(wrap);
}

function clearQR() { qr.innerHTML = ''; }

function scrollBottom() {
  setTimeout(() => msgs.scrollTop = msgs.scrollHeight, 50);
}

function runFlow(flowKey, arg) {
  const flow = flows[flowKey];
  if (!flow) return;
  step = flowKey;
  clearQR();

  showTyping();
  setTimeout(() => {
    removeTyping();
    flow.bot.forEach(fn => addBotMsg(fn(arg)));
    if (flow.quickReplies) showQuickReplies(flow.quickReplies);
    if (flow.input) {
      document.getElementById('chatInput').placeholder =
        flow.input === 'name' ? '이름을 입력하세요...' : '이메일을 입력하세요...';
    }
  }, 800);
}

function handleQR(text) {
  addUserMsg(text);
  clearQR();
  if (text.includes('책 소개')) runFlow('info');
  else if (text.includes('구매하기')) runFlow('buy_start');
  else if (text.includes('자주 묻는')) runFlow('faq');
  else if (text.includes('처음으로')) runFlow('start');
  else if (text.includes('입금 완료')) runFlow('done');
}

function handleKey(e) {
  if (e.key === 'Enter') sendMessage();
}

function sendMessage() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  addUserMsg(text);
  clearQR();

  if (step === 'buy_start') {
    userData.name = text;
    runFlow('buy_email', text);
  } else if (step === 'buy_email') {
    if (!text.includes('@')) {
      showTyping();
      setTimeout(() => {
        removeTyping();
        addBotMsg('올바른 이메일 형식으로 입력해주세요.<br>예: example@gmail.com');
      }, 600);
      return;
    }
    userData.email = text;
    runFlow('buy_confirm', text);
  } else {
    // 자유 입력 처리
    showTyping();
    setTimeout(() => {
      removeTyping();
      addBotMsg(`죄송합니다, 아직 이해하지 못했어요 😅<br>아래 버튼을 이용해주세요.`);
      showQuickReplies(['📖 책 소개 보기', '💳 구매하기', '❓ 자주 묻는 질문']);
    }, 600);
  }
}

// 시작
setTimeout(() => runFlow('start'), 400);
</script>
</body>
</html>
